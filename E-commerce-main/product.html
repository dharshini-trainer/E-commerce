<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Product - Skincare</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<header>
<nav>
<div>
<h1>Skincare</h1>
</div>
<div>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="products.html">Products</a></li>
<li><a href="cart.html">Cart</a></li>
<li><a href="contacts.html">Contact Us</a></li>
</ul>
</div>
</nav>
</header>
<main class="product-page">
<div class="product-details-container">
<div class="product-gallery">
<img id="mainProductImage" class="main-product-image" src="" alt="">
<div id="thumbnailContainer" class="thumbnail-container"></div>
</div>
<div class="product-details-info">
<h1 id="productName"></h1>
<div id="productRating" class="product-rating"></div>
<h2 id="productPrice"></h2>
<p id="productDescription"></p>
<h3>Product Details</h3>
<ul id="productFeatures"></ul>
<div class="product-actions">
<button id="addCartButton">Add to Cart</button>
<button id="buyNowButton">Buy Now</button>
</div>
</div>
</div>
</main>
<div id="checkoutModal" class="modal">
<div class="modal-content">
<button class="close-button" onclick="closeCheckout()">×</button>
<h2>Shipping Details</h2>
<p>Please enter your delivery details.</p>
<form id="checkoutForm">
<label for="customerName">Full Name</label>
<input type="text" id="customerName" placeholder="Enter your full name" required>
<label for="customerPhone">Mobile Number</label>
<input type="tel" id="customerPhone" placeholder="Enter 10 digit mobile number" maxlength="10" required>
<label for="customerAddress">Address</label>
<textarea id="customerAddress" rows="4" placeholder="Enter your complete address" required></textarea>
<label for="customerCity">City</label>
<input type="text" id="customerCity" placeholder="Enter city" required>
<label for="customerState">State</label>
<input type="text" id="customerState" placeholder="Enter state" required>
<label for="customerPincode">Pincode</label>
<input type="text" id="customerPincode" placeholder="Enter 6 digit pincode" maxlength="6" required>
<button type="submit" class="place-order-button">Place Order</button>
</form>
</div>
</div>
<div id="successModal" class="modal">
<div class="success-content">
<div class="success-icon">✓</div>
<h2>Order Placed Successfully!</h2>
<p>Thank you for shopping with us.</p>
<p id="orderMessage"></p>
<button onclick="closeSuccess()">Continue Shopping</button>
</div>
</div>
<footer>
<p>© 2026 Skincare. All Rights Reserved.</p>
</footer>
</body>
</html>

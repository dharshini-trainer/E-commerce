<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunscreen - Skincare</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <nav>
        <div>
            <h1>Skincare</h1>
        </div>

        <div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contacts.html">Contact Us</a></li>
            </ul>
        </div>
    </nav>
</header>


<main class="product-page">

    <div class="product-detail">

        <div class="image-gallery">

            <div class="main-image">
                <img id="mainProductImage"
                     src="images/Sunscreen.jpg"
                     alt="Sunscreen">
            </div>

            <div class="thumbnail-container">

                <img src="images/Sunscreen.jpg"
                     onclick="changeImage(this)"
                     class="thumbnail"
                     alt="Sunscreen">

                <img src="images/Sunscreen2.jpg"
                     onclick="changeImage(this)"
                     class="thumbnail"
                     alt="Sunscreen">

                <img src="images/Sunscreen3.jpg"
                     onclick="changeImage(this)"
                     class="thumbnail"
                     alt="Sunscreen">

                <img src="images/Sunscreen4.jpg"
                     onclick="changeImage(this)"
                     class="thumbnail"
                     alt="Sunscreen">

                <img src="images/Sunscreen5.jpg"
                     onclick="changeImage(this)"
                     class="thumbnail"
                     alt="Sunscreen">

            </div>

        </div>


        <div class="product-information">

            <h1>Sunscreen</h1>

            <div class="rating">
                ★★★★★
                <span>4.8/5</span>
            </div>

            <h2>₹500</h2>

            <p>
                Protect your skin from harmful UV rays with
                our lightweight daily sunscreen.
            </p>

            <h3>Product Benefits</h3>

            <ul>
                <li>UV protection</li>
                <li>Lightweight formula</li>
                <li>Non-greasy</li>
                <li>Suitable for daily use</li>
                <li>Easy to apply</li>
            </ul>

            <div class="product-actions">

            <button onclick="addToCart('Sunscreen',500,'images/Sunscreen.jpg')">Add to Cart</button>
<button onclick="buyNow('Sunscreen',500,'images/Sunscreen.jpg')">Buy Now</button>

            </div>

        </div>

    </div>

</main>

</body>
</html>
